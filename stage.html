<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>0-Uidgets · Interactive 3D preview</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/stage.css" />
</head>
<body>
  <div class="win-wallpaper" aria-hidden="true"><div class="stage-orbit"></div><div class="stage-floor"></div></div>
  <div class="stage-hud-pill" aria-live="polite"><span class="hud-dot"></span><strong id="hud-species-name">Buggy</strong></div>
  <!-- One host, one creature, one WebGL context. Teardown lives in stage-host.js. -->
  <div id="ai-avatar-widget"></div>
  <footer class="win11-taskbar">
    <div class="tb-left"><span id="tb-mode-pill"></span></div>
    <div class="tb-center" aria-hidden="true">
      <span class="tb-windows"><i></i><i></i><i></i><i></i></span>
      <span class="tb-app-icon"></span><span class="tb-app-icon active"><i class="hud-dot"></i></span>
    </div>
    <div class="tb-right">
      <button type="button" id="tray-bot-btn" class="tb-tray-bot" title="Pet"><span class="hud-dot" aria-hidden="true"></span></button>
      <div class="tb-clock"><span id="tb-time"></span><span id="tb-date"></span></div>
    </div>
  </footer>
  <script type="module" src="./js/stage-host.js"></script>
</body>
</html>
