<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Zero-UI 3D Desktop Stage (v1.1.0)</title>
    <link rel="stylesheet" href="./css/stage.css" />
  </head>
  <body>
    <!-- Ambient Windows 11 Mica/Bloom Wallpaper -->
    <div class="win-wallpaper" aria-hidden="true">
      <div class="bloom-orb bloom-primary"></div>
      <div class="bloom-orb bloom-secondary"></div>
      <div class="desktop-grid"></div>
    </div>

    <!-- Simulated Background App Window (pointer-events: none so 3D creature drags freely over it) -->
    <section class="sim-app-window" aria-hidden="true">
      <div class="sim-win-titlebar">
        <div class="sim-win-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="sim-win-title" id="sim-win-title">release-v1.1.0 — Workspace</span>
        <span class="sim-win-tag">alpha = 0 · Click-Through</span>
      </div>
      <div class="sim-win-body">
        <div class="sim-code-line">
          <span class="sim-prompt">▸</span>
          <span id="sim-line-1">Loading specialist workflow…</span>
        </div>
        <div class="sim-code-line">
          <span class="sim-prompt">▸</span>
          <span id="sim-line-2">100% Offline 3D Companion + Optional BYOK AI</span>
        </div>
      </div>
    </section>

    <!-- Floating Live Creature Pill -->
    <div class="stage-hud-pill" aria-live="polite">
      <span class="hud-dot"></span>
      <strong id="hud-species-name">BUGGY</strong>
      <span class="hud-sep">·</span>
      <span id="hud-physics-label">Volume-Conserving Jelly</span>
    </div>

    <!-- Isolated Single-Species WebGL Mount Point -->
    <div id="ai-avatar-widget"></div>

    <!-- Simulated Windows 11 Taskbar -->
    <footer class="win11-taskbar" aria-label="Simulated Windows 11 Taskbar">
      <div class="tb-left">
        <span class="tb-weather-pill" id="tb-mode-pill">Offline 3D Ready</span>
      </div>

      <div class="tb-center" aria-hidden="true">
        <span class="tb-icon tb-start" title="Windows 11 Desktop">
          <svg viewBox="0 0 24 24"><path d="M3 3h8.2v8.2H3V3zm9.8 0H21v8.2h-8.2V3zM3 12.8h8.2V21H3v-8.2zm9.8 0H21V21h-8.2v-8.2z"/></svg>
        </span>
        <span class="tb-icon" title="Code / IDE">
          <svg viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        </span>
        <span class="tb-icon" title="Terminal">
          <svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm2.6 4.4L9.2 12l-2.6 2.6 1.4 1.4 4-4-4-4-1.4 1.4zM12 15h6v-2h-6v2z"/></svg>
        </span>
        <span class="tb-icon active" title="Active Zero-UI Companion">
          <span class="tb-active-dot"></span>
          <img id="tb-center-avatar" src="./buggy-avatar-3d.png" alt="" />
        </span>
      </div>

      <div class="tb-right">
        <button
          type="button"
          class="tb-tray-bot"
          id="tray-bot-btn"
          title="Left-click: Pet / Wake · Right-click: Live Settings"
        >
          <img id="tb-tray-avatar" src="./buggy-avatar-3d.png" alt="Tray Icon" />
        </button>
        <div class="tb-clock">
          <span id="tb-time">12:00</span>
          <span id="tb-date">11/16/2026</span>
        </div>
      </div>
    </footer>

    <script type="module" src="./js/stage-host.js"></script>
  </body>
</html>
